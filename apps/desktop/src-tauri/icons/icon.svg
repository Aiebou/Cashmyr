<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source des icônes : « pnpm tauri icon src-tauri/icons/icon.svg » depuis apps/desktop.
       Tuile claire à la grille macOS (824 px, marge 100), anneau des trois enveloppes :
       besoins 50 %, envies 30 %, épargne 20 %, aux couleurs du thème clair. -->
