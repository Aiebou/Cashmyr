[package]
name = "cashmyr"
version = "0.1.0"
description = "Budget personnel hors ligne"
authors = ["Aiebou"]
license = "MIT"
repository = "https://github.com/Aiebou/Cashmyr"
edition = "2021"
publish = false

[lib]
name = "cashmyr_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
