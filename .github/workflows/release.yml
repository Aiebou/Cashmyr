# Application de bureau. Un tag v* (v0.1.0…) construit macOS, Windows et Linux, signe
# chaque paquet pour l'updater et les attache à un brouillon de Release. Le brouillon
# n'est publié qu'une fois tout en place : l'updater ne voit jamais une Release à moitié remplie.
name: Release du bureau

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Vérifications et brouillon
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Le tag et les numéros de version concordent
        run: |
          tag="${GITHUB_REF_NAME#v}"
          desktop=$(node -p "require('./apps/desktop/package.json').version")
          web=$(node -p "require('./apps/web/package.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)
          echo "tag $tag · bureau $desktop · web $web · crate $crate"
          if [ "$tag" != "$desktop" ] || [ "$tag" != "$web" ] || [ "$tag" != "$crate" ]; then
            echo "::error::$GITHUB_REF_NAME ne correspond pas à apps/desktop/package.json, apps/web/package.json et Cargo.toml."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Brouillon de la Release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) \(.draft)\"")
          if [ -n "$found" ]; then
            read -r id draft <<< "$found"
            if [ "$draft" != "true" ]; then
              echo "::error::La Release $GITHUB_REF_NAME est déjà publiée : elle n'est pas modifiée."
              exit 1
            fi
            echo "Brouillon existant $id, repris."
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Cashmyr ${GITHUB_REF_NAME#v}" \
              -f body="$(cat .github/release-notes.md)" \
              -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Binaires ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Un seul paquet pour les Mac Apple Silicon et Intel.
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          # La plus ancienne glibc disponible : l'AppImage tourne ainsi sur plus de distributions.
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé privée de l'updater et son mot de passe, en secrets du dépôt. La clé publique est dans tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          # Windows : l'updater installe le setup.exe (NSIS), qui ne demande pas de droits d'administrateur.
          updaterJsonPreferNsis: true
          retryAttempts: 1
          # tauri.release.conf.json ajoute les archives signées de l'updater.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  publish:
    name: Publication
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
    steps:
      - name: latest.json couvre les quatre plateformes, à la bonne version
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.name == "latest.json") | .url')
          if [ -z "$url" ]; then
            echo "::error::latest.json manque à la Release."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "$url" > latest.json
          node -e '
            const json = JSON.parse(require("node:fs").readFileSync("latest.json", "utf8"));
            const expected = ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"];
            const missing = expected.filter((p) => !json.platforms?.[p]?.url || !json.platforms[p].signature);
            const version = process.env.GITHUB_REF_NAME.slice(1);
            if (json.version !== version) throw new Error(`latest.json annonce ${json.version} au lieu de ${version}`);
            if (missing.length > 0) throw new Error(`latest.json ne couvre pas ${missing.join(", ")}`);
            console.log(Object.keys(json.platforms).sort().join("\n"));
          '
      - name: Publication de la Release
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
